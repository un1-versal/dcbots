<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости — Digital Crafts</title>
    <meta name="description" content="Новости Digital Crafts — поступления, скидки, обновления.">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">Digital<span>Crafts</span></a>
            <div class="nav">
                <a href="index.html">Витрина</a>
                <a href="news.html" class="active">Новости</a>
                <a href="support.html">Поддержка</a>
                <a href="contacts.html">Реквизиты</a>
            </div>
        </div>
    </header>

    <section class="page">
        <div class="container">
            <h1>Новости</h1>
            <div id="newsContainer" class="product-grid"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Digital Crafts. Все права защищены.</p>
            <p style="margin-top: 10px;">
                <a href="index.html">Витрина</a> |
                <a href="news.html">Новости</a> |
                <a href="support.html">Поддержка</a> |
                <a href="contacts.html">Реквизиты</a> |
                <a href="offer.html">Оферта</a>
            </p>
        </div>
    </footer>

    <script>
        //загрузка новостей из data/news.json
        async function loadNews() {
            const c = document.getElementById('newsContainer');
            try {
                const r = await fetch('data/news.json');
                const n = await r.json();
                if (!n || n.length === 0) {
                    c.innerHTML = '<p style="text-align:center;color:#9aa1af;grid-column:1/-1;">Новостей пока нет. Заглядывайте позже.</p>';
                    return;
                }
                c.innerHTML = n.map(i => `
                    <div class="product-card">
                        <div class="product-badge">${i.category || 'Новость'}</div>
                        <h3 class="product-title">${i.title}</h3>
                        <p class="product-region">${i.date || ''}</p>
                        <p class="product-desc">${i.description || ''}</p>
                    </div>
                `).join('');
            } catch {
                c.innerHTML = '<p style="text-align:center;color:#9aa1af;grid-column:1/-1;">Новостей пока нет. Заглядывайте позже.</p>';
            }
        }
        loadNews();
    </script>
</body>
</html>
